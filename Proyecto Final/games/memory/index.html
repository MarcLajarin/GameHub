<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Match | Premium Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <header>
            <a href="../../index.html" class="back-link">← Gallery</a>
            <div class="stats">
                <div class="stat-box">MOVES: <span id="moves">0</span></div>
                <div class="stat-box">TIME: <span id="time">00:00</span></div>
            </div>
        </header>

        <main class="memory-grid">
            <!-- Cards generated by JS -->
        </main>

        <!-- End Screen -->
        <div id="end-screen" class="overlay" style="display: none;">
            <div class="result-box">
                <h1>HOT MATCH! 🔥</h1>
                <p>Moves: <span id="final-moves"></span></p>
                <p>Time: <span id="final-time"></span></p>
                <button id="restart-btn">PLAY AGAIN 😈</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
