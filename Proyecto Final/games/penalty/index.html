<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Striker | Premium Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <header>
            <a href="../../index.html" class="back-link">← Back to Gallery</a>

            <div class="scoreboard">
                <div class="score-box">
                    <span class="label">PLAYER</span>
                    <span id="player-score" class="score">0</span>
                </div>
                <div class="round-display" id="round-display">Round 1 / 5</div>
                <div class="score-box">
                    <span class="label">CPU</span>
                    <span id="cpu-score" class="score">0</span>
                </div>
            </div>
        </header>

        <main class="field">
            <div class="goal-area">
                <div class="goal-frame">
                    <div class="net"></div>
                    <div id="goalie" class="goalie"></div>

                    <!-- Clickable Target Grid -->
                    <div class="target-grid">
                        <div class="target-zone" data-zone="TL"></div>
                        <div class="target-zone" data-zone="TC"></div>
                        <div class="target-zone" data-zone="TR"></div>
                        <div class="target-zone" data-zone="BL"></div>
                        <div class="target-zone" data-zone="BC"></div>
                        <div class="target-zone" data-zone="BR"></div>
                    </div>
                </div>
                <div id="message" class="msg">Select a corner to shoot!</div>
            </div>

            <div class="penalty-spot">
                <div id="ball" class="ball">⚽</div>
            </div>
        </main>

        <!-- No separate buttons needed now -->
        <div class="controls" style="display:none;"></div>
    </div>

    <!-- Final Overlay -->
    <div class="end-screen" style="display: none;">
        <div class="end-card">
            <h2>YOU WIN!</h2>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
